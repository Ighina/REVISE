# End-to-end smoke test on a tiny model (runs in minutes on CPU).
run_name: smoke_qwen05b
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  num_threads: 32
  batch_size: 8
  max_new_tokens: 12
data:
  dataset: musique
  split: validation
  hops: [2]
  pool_limit: 80
  n_questions: 24
  select: wrong_closed_book
  seed: 0
  n_random_perms: 1
regimes: [evidence_only, evidence_augmented]
conversational:
  enabled: true
analysis:
  splits: [question, document]
  test_frac: 0.35
  layers: [4, 8, 12, 16, 20, 24]
steer:
  alphas: [-4, 0, 4]
  max_questions: 6
  split: question
patch:
  max_questions: 6
  split: question
adaptive:
  split: question
