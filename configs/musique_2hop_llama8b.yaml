# Model-family transfer: Llama-3.1-8B-Instruct (weights linked from the shared cache).
run_name: musique2hop_llama8b
model: {name: meta-llama/Llama-3.1-8B-Instruct, num_threads: 64, batch_size: 8}
data: {dataset: musique, split: train, hops: [2], pool_limit: 4000, n_questions: 2000}
regimes: [evidence_only]
conversational: {enabled: false}
analysis: {splits: [question, document, answer, relation]}
steer: {directions: [{task: state_sufficiency}], alphas: [-8, 8, 32], max_questions: 150, split: document}
patch: {tasks: [state_sufficiency, uptake], modes: [single, multi], max_questions: 150, split: document}
