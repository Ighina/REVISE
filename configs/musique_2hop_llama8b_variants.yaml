# Model-family replication (Llama-3.1-8B-Instruct) of the Qwen run musique_2hop_qwen7b_variants.yaml.
# ESTB linguistic-form axis: MuSiQue 2-hop with LLM paraphrase / partial variants and cross-dataset independent sources.
run_name: musique2hop_llama8b_variants
model: {name: meta-llama/Llama-3.1-8B-Instruct, num_threads: 64, batch_size: 8}
data: {dataset: musique, split: train, hops: [2], pool_limit: 4000, n_questions: 1200, select: wrong_closed_book, n_random_perms: 0}
variants: {llm: true, independent: true}
regimes: [evidence_only]
conversational: {enabled: false}
analysis: {splits: [question, document, answer, relation]}
patch: {tasks: [state_sufficiency], modes: [multi], max_questions: 150, split: document}
ablate: {experiments: [projout], projout_tasks: [state_sufficiency], max_questions: 150, split: document}
# paraphrases / judge verdicts come from Qwen so that evidence text and labels match across families
aux_model: Qwen/Qwen2.5-7B-Instruct
